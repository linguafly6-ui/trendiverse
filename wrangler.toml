name = "trendiverse"
compatibility_date = "2024-10-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 is optional for local/demo mode. The app falls back to sample data when no DB binding is present.
# Top-level bindings apply to local development and to the production branch.
# The production database id is unknown in this file, so the production binding stays commented out.

# [[d1_databases]]
# binding = "DB"
# database_name = "trendiverse-db"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# migrations_dir = "migrations"

# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[vars]
ENVIRONMENT = "production"

# Pages does not inherit vars into env.preview. Repeat the existing value so a preview
# deploy keeps it. This block is the only D1 binding, and it is the preview database.
[env.preview.vars]
ENVIRONMENT = "production"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "trendiverse-preview"
database_id = "2bb04eb3-9f3f-40b3-a6ed-b1f58dc9107f"
