name = "trendiverse"
compatibility_date = "2024-10-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Replace database_id with the id returned by `wrangler d1 create trendiverse-db`
[[d1_databases]]
binding = "DB"
database_name = "trendiverse-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
migrations_dir = "migrations"

# Replace id with the id returned by `wrangler kv namespace create CACHE`
# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[vars]
ENVIRONMENT = "production"
