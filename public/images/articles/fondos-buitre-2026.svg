<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Fondos buitre en 2026: el decreto que prohíbe comprar vivienda por debajo del 70% de su valor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1010" cy="140" r="200" fill="#059669" opacity="0.10"/>
  <circle cx="160" cy="540" r="150" fill="#22C55E" opacity="0.07"/>

  <!-- buildings -->
  <g opacity="0.9">
    <rect x="700" y="180" width="96" height="300" rx="6" fill="#1F2937"/>
    <rect x="812" y="240" width="80" height="240" rx="6" fill="#273244"/>
    <rect x="908" y="150" width="104" height="330" rx="6" fill="#1F2937"/>
    <g fill="#4B5563">
      <rect x="716" y="200" width="22" height="22" rx="3"/>
      <rect x="752" y="200" width="22" height="22" rx="3"/>
      <rect x="716" y="240" width="22" height="22" rx="3"/>
      <rect x="752" y="240" width="22" height="22" rx="3"/>
      <rect x="716" y="280" width="22" height="22" rx="3"/>
      <rect x="752" y="280" width="22" height="22" rx="3"/>
      <rect x="924" y="172" width="24" height="24" rx="3"/>
      <rect x="964" y="172" width="24" height="24" rx="3"/>
      <rect x="924" y="216" width="24" height="24" rx="3"/>
      <rect x="964" y="216" width="24" height="24" rx="3"/>
      <rect x="924" y="260" width="24" height="24" rx="3"/>
      <rect x="964" y="260" width="24" height="24" rx="3"/>
      <rect x="828" y="260" width="20" height="20" rx="3"/>
      <rect x="860" y="260" width="20" height="20" rx="3"/>
    </g>
  </g>

  <!-- percentage badge -->
  <g transform="translate(716 92)">
    <rect x="0" y="0" width="300" height="60" rx="30" fill="url(#accent)"/>
    <text x="150" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#04220F" letter-spacing="1.2">UMBRAL DEL 70%</text>
  </g>

  <!-- headline -->
  <g transform="translate(118 200)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#FFFFFF">Fondos buitre</text>
    <text x="0" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="url(#accent)">en 2026</text>
  </g>

  <text x="118" y="384" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#94A3B8">El decreto que frena la compra especulativa</text>
  <text x="118" y="426" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#64748B">Vigencia · excepciones · grandes propietarios</text>

  <g transform="translate(118 462)">
    <rect x="0" y="0" width="252" height="50" rx="25" fill="#1F2937" stroke="#22C55E" stroke-width="2" opacity="0.95"/>
    <text x="126" y="33" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#22C55E">REAL DECRETO-LEY</text>
  </g>
</svg>
