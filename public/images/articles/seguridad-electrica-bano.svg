<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Seguridad eléctrica en el baño: cómo evitar electrocuciones en la ducha">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="140" r="190" fill="#F59E0B" opacity="0.09"/>
  <circle cx="150" cy="550" r="150" fill="#EF4444" opacity="0.07"/>

  <!-- shower head with water -->
  <g transform="translate(760 168)">
    <path d="M40 30 L200 30" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 30 L120 0" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <rect x="40" y="30" width="160" height="26" rx="10" fill="#CBD5E1"/>
    <g stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.75">
      <path d="M60 70 L52 150"/>
      <path d="M92 70 L84 168"/>
      <path d="M124 70 L118 156"/>
      <path d="M156 70 L150 170"/>
      <path d="M188 70 L180 150"/>
    </g>
    <path d="M20 186 C 120 160 240 200 260 178 L280 250 L0 250 Z" fill="url(#water)"/>
  </g>

  <!-- shield / protection badge -->
  <g transform="translate(1010 300)">
    <path d="M60 0 L124 26 L124 96 C124 140 92 168 60 180 C 28 168 -4 140 -4 96 L-4 26 Z" fill="none" stroke="#F59E0B" stroke-width="11" stroke-linejoin="round"/>
    <path d="M28 88 L52 114 L96 58" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- spark / hazard mark -->
  <g transform="translate(690 400)">
    <path d="M30 0 L52 44 L14 44 Z" fill="#EF4444"/>
    <path d="M30 44 L52 88 L14 88 Z" fill="#EF4444" opacity="0.55"/>
  </g>

  <!-- headline -->
  <g transform="translate(112 200)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FFFFFF">Seguridad</text>
    <text x="0" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FFFFFF">eléctrica en</text>
    <text x="0" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="url(#accent)">el baño</text>
  </g>

  <g transform="translate(112 400)">
    <rect x="0" y="0" width="286" height="54" rx="27" fill="url(#accent)"/>
    <text x="143" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#2A1205" letter-spacing="1.3">DIFERENCIAL 30 mA</text>
  </g>

  <text x="112" y="506" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#FCD34D">Qué protege realmente y cómo comprobarlo</text>
  <text x="112" y="546" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#64748B">Zonas del baño · errores frecuentes · ante una descarga</text>
</svg>
