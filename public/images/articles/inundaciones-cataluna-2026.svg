<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Inundaciones en Cataluña en octubre de 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- rain -->
  <g stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <path d="M150 60 L120 150"/>
    <path d="M300 30 L270 120"/>
    <path d="M450 70 L420 160"/>
    <path d="M1010 50 L980 140"/>
    <path d="M1150 90 L1120 180"/>
    <path d="M250 200 L220 290"/>
    <path d="M1080 230 L1050 320"/>
    <path d="M380 250 L350 340"/>
  </g>

  <!-- headline -->
  <g transform="translate(140 200)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#FFFFFF">Inundaciones</text>
    <text x="0" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="url(#accent)">en Cataluña</text>
  </g>

  <g transform="translate(140 356)">
    <rect x="0" y="0" width="196" height="52" rx="26" fill="url(#accent)"/>
    <text x="98" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">OCTUBRE 2026</text>
  </g>

  <text x="140" y="458" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#94A3B8">Comarcas afectadas · Niveles de alerta</text>
  <text x="140" y="504" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#64748B">Qué hacer ante lluvias torrenciales</text>

  <!-- flood water at the bottom -->
  <path d="M0 566 C 150 536 300 596 452 566 C 604 536 756 596 908 566 C 1010 546 1110 576 1200 560 L1200 630 L0 630 Z" fill="url(#water)"/>

  <!-- warning triangle -->
  <g transform="translate(846 250)">
    <path d="M110 0 L220 190 L0 190 Z" fill="none" stroke="#EF4444" stroke-width="12" stroke-linejoin="round"/>
    <rect x="100" y="62" width="20" height="72" rx="10" fill="#EF4444"/>
    <circle cx="110" cy="158" r="13" fill="#EF4444"/>
  </g>
</svg>
