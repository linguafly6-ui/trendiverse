    <path d="M-30,0 L-10,-20 L15,-20 L30,0 M-10,-20 L5,0 M-30,0 L5,0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Belgium flag colors -->
  <rect x="0" y="0" width="40" height="630" fill="#000" opacity="0.8"/>
  <rect x="40" y="0" width="40" height="630" fill="#facc15" opacity="0.8"/>
