  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- Gold medal circle -->
  <circle cx="600" cy="280" r="100" fill="url(#gold)" stroke="#fff" stroke-width="4" opacity="0.95"/>
  <text x="600" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#78350f">6</text>
  <text x="600" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f">OROS</text>
