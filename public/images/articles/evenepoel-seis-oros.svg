  <text x="600" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fde047">CAMPEONATO DE EUROPA DE CICLISMO 2026</text>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a78bfa">4 OCT 2026 · LIUBLIANA, ESLOVENIA</text>
