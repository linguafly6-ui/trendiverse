  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff">EVENEPOEL</text>
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#fde047">CIERRA LA COLECCIÓN</text>
  <!-- Bottom bar -->
