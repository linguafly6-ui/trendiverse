name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Serialize CI and deployment so only one build runs at a time.
concurrency:
  group: trendiverse-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: https://trendiverse.org
