name: Deploy TrendiVerse to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm run pages:build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ cfat_Q1EM6No1XmJxpMNEtI3uf6yJvXbyfMZjhaC4Dxgm09240fc1  }}
          accountId: ${{ 80d743b2c4f0e00b585a017c2588d940  }}
          command: pages deploy .vercel/output/static --project-name=trendiverse
