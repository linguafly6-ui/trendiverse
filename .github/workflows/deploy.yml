name: Deploy TrendiVerse to Cloudflare Pages

on:
  push:
    branches:
      - main

# Serialize CI and deployment so only one build runs at a time.
concurrency:
  group: trendiverse-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: https://trendiverse.org
      - name: Ensure supplements category exists in D1
        run: >-
          npx wrangler d1 execute trendiverse-preview --remote
          --command "INSERT OR IGNORE INTO categories (name, slug, color, icon, description)
          VALUES ('Suplementos', 'suplementos', '#0D9488', '🌿', 'Guías informativas sobre suplementos, vitaminas, minerales y nutrición: evidencia científica, posibles efectos secundarios, interacciones y criterios para elegir productos con seguridad.');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=trendiverse
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
