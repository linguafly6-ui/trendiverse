name: Deploy TrendiVerse to Cloudflare Pages

on:
  push:
    branches:
      - main

# Serialize CI and deployment so only one build runs at a time.
concurrency:
  group: trendiverse-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: https://trendiverse.org
      - name: Bootstrap legacy article content into D1 without overwriting existing records
        run: npx tsx scripts/sync-embedded-articles-to-d1.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: trendiverse-preview
      - name: Audit all D1 article images against public R2
        run: npx tsx scripts/audit-d1-r2-images.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: trendiverse-preview
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
      - name: Repair article image URLs and verify public R2 uploads
        run: npx tsx scripts/repair-d1-r2-images.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: trendiverse-preview
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
      - name: Re-audit D1 article images after repair
        run: npx tsx scripts/audit-d1-r2-images.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: trendiverse-preview
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
      - name: Sync D1 categories with navigation
        run: npx wrangler d1 execute trendiverse-preview --remote --file=migrations/0006_sync_navigation_categories.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=trendiverse
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test live article API and public R2 image
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://trendiverse.pages.dev/api/articles?limit=3"
          response="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$api_url")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (!Array.isArray(payload.articles) || payload.articles.length === 0) {
              console.error("La API pública no devuelve artículos desde D1.");
              process.exit(1);
            }
            for (const article of payload.articles) {
              if (!article.slug || !article.title || !article.content) {
                console.error("La API pública devuelve un artículo incompleto.");
                process.exit(1);
              }
            }
            console.log(JSON.stringify({
              success: true,
              endpoint: "https://trendiverse.pages.dev/api/articles?limit=3",
              articlesChecked: payload.articles.length,
              slugs: payload.articles.map(article => article.slug)
            }));
          ' "$response"
          image_url="https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev/articles/el-colageno-polvo-capsulas-o-comprimidos.svg"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --output /dev/null "$image_url"
          echo "R2_PUBLIC_IMAGE_OK $image_url"
