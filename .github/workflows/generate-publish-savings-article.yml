name: Generate and publish one savings article with Workers AI

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Exact H1 from the approved savings editorial plan"
        required: true
        type: string
      slug:
        description: "Unique lowercase URL slug"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trendiverse-ai-savings-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate, validate and publish article
        run: npx tsx scripts/generate-and-publish-savings-article.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: trendiverse-articles
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
          D1_DATABASE: trendiverse-preview
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_SLUG: ${{ inputs.slug }}
          WORKERS_AI_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
