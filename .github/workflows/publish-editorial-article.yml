name: Publish approved editorial article to D1 and R2

on:
  push:
    branches:
      - main
    paths:
      - "lib/seo-batch-04.ts"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug exacto (publish/generate; no necesario en batch)"
        required: false
        type: string
      mode:
        description: "Tipo de publicación (batch para generar y publicar artículos de ahorro)"
        required: false
        default: batch
        type: choice
        options:
          - publish
          - generate
          - batch
      title:
        description: "Título exacto del artículo (obligatorio en modo generate)"
        required: false
        type: string
      start_id:
        description: "ID inicial de la cola editorial (1–500)"
        required: false
        default: 5
        type: number
      batch_size:
        description: "Artículos secuenciales por ejecución (1–5)"
        required: false
        default: 5
        type: number

permissions:
  contents: read

concurrency:
  group: trendiverse-publish-editorial-${{ github.event_name == 'workflow_dispatch' && inputs.slug || 'article-21' }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate and publish controlled savings batch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'batch' }}
        run: npx tsx scripts/generate-savings-batch.ts
        env:
          BATCH_START_ID: ${{ inputs.start_id }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: trendiverse-articles
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
          D1_DATABASE: trendiverse-preview
          WORKERS_AI_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

      - name: Generate with Workers AI and publish to D1 + R2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'generate' }}
        run: npx tsx scripts/generate-and-publish-savings-article.ts
        env:
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_SLUG: ${{ inputs.slug }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: trendiverse-articles
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
          D1_DATABASE: trendiverse-preview
          WORKERS_AI_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

      - name: Publish and verify D1 + R2
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode != 'generate' && inputs.mode != 'batch') }}
        run: npx tsx scripts/publish-editorial-article.ts "$ARTICLE_SLUG"
        env:
          ARTICLE_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || 'que-frutas-y-verduras-son-de-temporada-en-invierno' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: trendiverse-articles
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
