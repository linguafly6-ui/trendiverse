name: Publish approved editorial article to D1 and R2

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug exacto del artículo que ya ha sido aprobado"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trendiverse-publish-editorial-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish and verify D1 + R2
        run: npx tsx scripts/publish-editorial-article.ts "$ARTICLE_SLUG"
        env:
          ARTICLE_SLUG: ${{ inputs.slug }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: trendiverse-articles
          R2_PUBLIC_BASE_URL: https://pub-00a2ec9ac5c947ae8297dfc22e57718b.r2.dev
